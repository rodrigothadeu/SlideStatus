<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      height: 38px;
      background: #f4f4f5;
      border-bottom: 1px solid #e4e4e7;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn {
      width: 28px;
      height: 28px;
      border: none;
      background: #18181b;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .12s;
    }
    .btn:hover  { opacity: .8; }
    .btn:disabled { opacity: .35; cursor: default; }
  </style>
</head>
<body>
  <div class="header">
    <button class="btn" id="btn" onclick="expand()" title="Expandir SlideStatus">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>
  <script>
    function expand() {
      document.getElementById('btn').disabled = true;
      google.script.run.openSidebar();
    }
  </script>
</body>
</html>
