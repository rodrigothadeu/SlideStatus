<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <!-- Geist via Google Fonts — mesmo token do DS do time -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens DS — Light Mode ───────────────────────────────────────────── */
    :root {
      --font-sans:   'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
      --bg:          #ffffff;
      --surface:     #f4f4f5;
      --card:        #fafafa;
      --border:      #e4e4e7;
      --text:        #18181b;
      --text-muted:  #71717a;
      --text-subtle: #a1a1aa;
      --radius:      6px;
      --radius-sm:   4px;
      --radius-full: 9999px;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);

      /* Categorias de progresso */
      --color-done:        #10B981;
      --color-done-bg:     rgba(16,185,129,.1);
      --color-progress:    #3B82F6;
      --color-progress-bg: rgba(59,130,246,.1);
      --color-pending:     #a1a1aa;
      --color-pending-bg:  rgba(161,161,170,.12);

      --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
      --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
    }

    /* ── Reset & Base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-2) var(--sp-4);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      height: 38px;
    }
    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--sp-1);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, color .12s;
      flex-shrink: 0;
    }
    .btn-icon:hover { background: var(--border); color: var(--text); }
    .btn-icon.spinning svg { animation: spin .7s linear infinite; }

    /* ── Progress Bar ─────────────────────────────────────────────────────── */
    .progress-section {
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .progress-track {
      height: 5px;
      border-radius: var(--radius-full);
      background: var(--border);
      overflow: hidden;
      display: flex;
    }
    .progress-seg {
      height: 100%;
      transition: width .35s ease;
      min-width: 0;
    }
    .progress-seg.done     { background: var(--color-done); }
    .progress-seg.progress { background: var(--color-progress); }
    .progress-seg.pending  { background: var(--color-pending); }

    .progress-labels {
      display: flex;
      gap: var(--sp-3);
      flex-wrap: wrap;
    }
    .progress-label {
      display: flex;
      align-items: center;
      gap: var(--sp-1);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .progress-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .progress-label strong {
      font-weight: 600;
      color: var(--text);
    }

    /* ── Slide list ───────────────────────────────────────────────────────── */
    .slide-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--sp-1) 0;
    }
    .slide-list::-webkit-scrollbar { width: 3px; }
    .slide-list::-webkit-scrollbar-track { background: transparent; }
    .slide-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .slide-item {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 6px var(--sp-4);
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .slide-item:hover { background: var(--surface); }
    .slide-item:last-child { border-bottom: none; }

    .slide-number {
      font-size: 11px;
      color: var(--text-subtle);
      font-weight: 500;
      min-width: 18px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Status Badge ─────────────────────────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .12s, box-shadow .12s;
      flex: 1;
      min-width: 0;
      line-height: 1.4;
    }
    .status-badge:hover { opacity: .82; box-shadow: var(--shadow-sm); }
    .status-badge-emoji { font-size: 12px; flex-shrink: 0; }
    .status-badge-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Status Selector ──────────────────────────────────────────────────── */
    .selector-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
    }
    .selector-overlay.open { display: block; }
    .selector-menu {
      position: fixed;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
      min-width: 200px;
      max-width: 264px;
      z-index: 20;
      overflow: hidden;
    }
    .selector-header {
      padding: 7px var(--sp-3);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .selector-option {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 7px var(--sp-3);
      cursor: pointer;
      transition: background .1s;
      font-size: 12px;
    }
    .selector-option:hover { background: var(--surface); }
    .selector-option.active { background: var(--surface); font-weight: 600; }
    .selector-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Loading / Empty / Error ──────────────────────────────────────────── */
    .loading, .empty-state, .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      flex: 1;
      color: var(--text-muted);
      font-size: 13px;
      padding: var(--sp-6);
      text-align: center;
    }
    .error-state { color: #dc2626; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--text-muted);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ────────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 44px;
      left: var(--sp-3);
      right: var(--sp-3);
      background: var(--text);
      color: #fafafa;
      font-size: 12px;
      font-weight: 500;
      padding: 7px var(--sp-3);
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity .2s;
      z-index: 30;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #dc2626; }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .footer {
      padding: 6px var(--sp-4);
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-subtle);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="header-title">SlideStatus</span>
    <button class="btn-icon" id="btnRefresh" onclick="manualRefresh()" title="Atualizar slides">
      <svg id="refreshIcon" width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
    </button>
  </div>

  <!-- Barra de progresso -->
  <div class="progress-section" id="progressSection" style="display:none">
    <div class="progress-track">
      <div class="progress-seg done"     id="segDone"     style="width:0%"></div>
      <div class="progress-seg progress" id="segProgress" style="width:0%"></div>
      <div class="progress-seg pending"  id="segPending"  style="width:0%"></div>
    </div>
    <div class="progress-labels" id="progressLabels"></div>
  </div>

  <!-- Lista de slides -->
  <div id="main" class="loading">
    <div class="spinner"></div>
    <span>Carregando slides...</span>
  </div>

  <!-- Dropdown de seleção de status -->
  <div class="selector-overlay" id="selectorOverlay" onclick="closeSelector()">
    <div class="selector-menu" id="selectorMenu">
      <div class="selector-header">Alterar status</div>
      <div id="selectorOptions"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <div class="footer">
    <span id="syncLabel">SlideStatus</span>
    <span id="slideCount" style="font-variant-numeric:tabular-nums"></span>
  </div>

  <script>
    // ── Estado ───────────────────────────────────────────────────────────────
    const AUTO_REFRESH_MS = 30000;

    let state = {
      slides: [],
      statuses: [],
      slideStatuses: {},
      isRefreshing: false,
      pendingSlideId: null,
      pendingOldStatusId: null
    };

    // ── Inicialização ────────────────────────────────────────────────────────
    google.script.run
      .withSuccessHandler(onInitialStateLoaded)
      .withFailureHandler(onLoadError)
      .getInitialState();

    function onInitialStateLoaded(data) {
      state.slides       = data.slides;
      state.statuses     = data.statuses;
      state.slideStatuses = data.slideStatuses || {};
      renderSlideList();
      renderProgressBar();
      startAutoRefresh();
      updateFooter();
    }

    function onLoadError(err) {
      document.getElementById('main').innerHTML =
        '<div class="error-state">Erro ao carregar:<br>' + escHtml(err.message || String(err)) + '</div>';
    }

    // ── Refresh ───────────────────────────────────────────────────────────────
    function manualRefresh() {
      if (state.isRefreshing) return;
      doRefresh();
    }

    function startAutoRefresh() {
      setInterval(doRefresh, AUTO_REFRESH_MS);
    }

    function doRefresh() {
      if (state.isRefreshing) return;
      state.isRefreshing = true;
      setRefreshSpinner(true);
      google.script.run
        .withSuccessHandler(onRefreshSuccess)
        .withFailureHandler(onRefreshError)
        .getInitialState();
    }

    function onRefreshSuccess(data) {
      state.isRefreshing = false;
      setRefreshSpinner(false);
      reconcileSlides(data.slides, data.statuses, data.slideStatuses || {});
    }

    function onRefreshError() {
      state.isRefreshing = false;
      setRefreshSpinner(false);
    }

    function reconcileSlides(newSlides, newStatuses, newSlideStatuses) {
      const oldIds = new Set(state.slides.map(function(s) { return s.id; }));
      const newIds = new Set(newSlides.map(function(s) { return s.id; }));
      const hasStructuralChange =
        newSlides.some(function(s) { return !oldIds.has(s.id); }) ||
        state.slides.some(function(s) { return !newIds.has(s.id); });

      state.statuses = newStatuses;
      Object.assign(state.slideStatuses, newSlideStatuses);

      if (hasStructuralChange) {
        state.slides = newSlides;
        state.slideStatuses = Object.assign({}, newSlideStatuses, state.slideStatuses);
        renderSlideList();
      }

      renderProgressBar();
      updateFooter();
    }

    function setRefreshSpinner(on) {
      const btn = document.getElementById('btnRefresh');
      if (btn) btn.classList.toggle('spinning', on);
    }

    // ── Renderização da lista de slides ───────────────────────────────────────
    function renderSlideList() {
      const main = document.getElementById('main');

      if (!state.slides || state.slides.length === 0) {
        main.className = 'empty-state';
        main.innerHTML = '<span>Nenhum slide encontrado.</span>';
        return;
      }

      main.className = 'slide-list';
      main.innerHTML = '';

      state.slides.forEach(function(slide) {
        const item = document.createElement('div');
        item.className = 'slide-item';
        item.id = 'slide-' + slide.id;

        const num = document.createElement('span');
        num.className = 'slide-number';
        num.textContent = slide.pageNumber;

        item.appendChild(num);
        item.appendChild(createBadgeEl(slide.id));
        main.appendChild(item);
      });
    }

    function createBadgeEl(slideId) {
      const s = resolveSlideStatus(slideId);
      const el = document.createElement('div');
      el.className = 'status-badge';
      el.id = 'badge-' + slideId;
      el.style.backgroundColor = hexToRgba(s.color, 0.11);
      el.style.color = s.color;
      el.innerHTML =
        '<span class="status-badge-emoji">' + s.emoji + '</span>' +
        '<span class="status-badge-name">' + escHtml(s.name) + '</span>';
      el.onclick = function(e) { e.stopPropagation(); openSelector(slideId, el); };
      return el;
    }

    function updateBadge(slideId, statusId) {
      const s = state.statuses.find(function(x) { return x.id === statusId; });
      if (!s) return;
      const el = document.getElementById('badge-' + slideId);
      if (!el) return;
      el.style.backgroundColor = hexToRgba(s.color, 0.11);
      el.style.color = s.color;
      el.innerHTML =
        '<span class="status-badge-emoji">' + s.emoji + '</span>' +
        '<span class="status-badge-name">' + escHtml(s.name) + '</span>';
    }

    // ── Barra de Progresso ────────────────────────────────────────────────────
    function computeStats() {
      const total = state.slides.length;
      if (total === 0) return null;
      const counts = { done: 0, in_progress: 0, pending: 0 };
      state.slides.forEach(function(slide) {
        const s = resolveSlideStatus(slide.id);
        const full = state.statuses.find(function(x) { return x.id === s.id; });
        const cat = full ? (full.category || 'pending') : 'pending';
        counts[cat] = (counts[cat] || 0) + 1;
      });
      const pDone = Math.round(counts.done / total * 100);
      const pIP   = Math.round(counts.in_progress / total * 100);
      const pPend = 100 - pDone - pIP;
      return {
        done:        { count: counts.done,        percent: pDone  },
        in_progress: { count: counts.in_progress, percent: pIP    },
        pending:     { count: counts.pending,     percent: pPend  },
        total: total
      };
    }

    function renderProgressBar() {
      const stats = computeStats();
      const section = document.getElementById('progressSection');
      if (!stats || stats.total === 0) { section.style.display = 'none'; return; }

      section.style.display = 'flex';
      document.getElementById('segDone').style.width     = stats.done.percent        + '%';
      document.getElementById('segProgress').style.width = stats.in_progress.percent + '%';
      document.getElementById('segPending').style.width  = stats.pending.percent     + '%';

      const labels = [];
      if (stats.done.count > 0)        labels.push(makeLabelHtml('var(--color-done)',     stats.done.percent,        stats.done.count,        'concluído'));
      if (stats.in_progress.count > 0) labels.push(makeLabelHtml('var(--color-progress)', stats.in_progress.percent, stats.in_progress.count, 'andamento'));
      if (stats.pending.count > 0)     labels.push(makeLabelHtml('var(--color-pending)',  stats.pending.percent,     stats.pending.count,     'pendente'));
      document.getElementById('progressLabels').innerHTML = labels.join('');
    }

    function makeLabelHtml(color, percent, count, label) {
      return '<span class="progress-label">' +
        '<span class="progress-dot" style="background:' + color + '"></span>' +
        '<strong>' + percent + '%</strong> ' + count + ' ' + label +
        (count !== 1 ? 's' : '') +
        '</span>';
    }

    // ── Status Selector ───────────────────────────────────────────────────────
    function openSelector(slideId, badgeEl) {
      const currentId = (state.slideStatuses[slideId] || {}).statusId || 'default-001';
      const opts = document.getElementById('selectorOptions');
      opts.innerHTML = '';
      state.statuses.forEach(function(s) {
        const opt = document.createElement('div');
        opt.className = 'selector-option' + (s.id === currentId ? ' active' : '');
        opt.innerHTML =
          '<span class="selector-dot" style="background:' + s.color + '"></span>' +
          escHtml(s.emoji + ' ' + s.name);
        opt.onclick = function(e) { e.stopPropagation(); selectStatus(slideId, s.id, currentId); };
        opts.appendChild(opt);
      });

      const rect = badgeEl.getBoundingClientRect();
      const menu = document.getElementById('selectorMenu');
      menu.style.top  = (rect.bottom + 4) + 'px';
      menu.style.left = rect.left + 'px';
      document.getElementById('selectorOverlay').classList.add('open');
    }

    function closeSelector() {
      document.getElementById('selectorOverlay').classList.remove('open');
    }

    function selectStatus(slideId, newId, oldId) {
      closeSelector();
      if (newId === oldId) return;

      // Atualização otimista
      if (!state.slideStatuses[slideId]) state.slideStatuses[slideId] = {};
      state.pendingSlideId    = slideId;
      state.pendingOldStatusId = oldId;
      state.slideStatuses[slideId].statusId = newId;
      updateBadge(slideId, newId);
      renderProgressBar();

      google.script.run
        .withSuccessHandler(onStatusUpdated)
        .withFailureHandler(onStatusUpdateFailed)
        .updateSlideStatus(slideId, newId);
    }

    function onStatusUpdated() {
      state.pendingSlideId = null;
      state.pendingOldStatusId = null;
    }

    function onStatusUpdateFailed(err) {
      if (state.pendingSlideId) {
        state.slideStatuses[state.pendingSlideId].statusId = state.pendingOldStatusId;
        updateBadge(state.pendingSlideId, state.pendingOldStatusId);
        renderProgressBar();
        state.pendingSlideId = null;
        state.pendingOldStatusId = null;
      }
      showToast('Erro: ' + escHtml(err.message || 'Falha ao salvar.'), true);
    }

    // ── Footer ────────────────────────────────────────────────────────────────
    function updateFooter() {
      const n = state.slides.length;
      document.getElementById('slideCount').textContent = n + ' slide' + (n !== 1 ? 's' : '');
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(function() { t.className = 'toast'; }, 2500);
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function resolveSlideStatus(slideId) {
      const entry = state.slideStatuses[slideId];
      const id = entry ? entry.statusId : 'default-001';
      return state.statuses.find(function(s) { return s.id === id; }) ||
        { id: 'default-001', name: 'A Fazer', emoji: '🔲', color: '#6B7280', category: 'pending' };
    }

    function hexToRgba(hex, a) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return 'rgba('+r+','+g+','+b+','+a+')';
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
