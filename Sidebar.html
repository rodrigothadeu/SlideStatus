<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #ffffff;
      --surface:     #f4f4f5;
      --card:        #fafafa;
      --border:      #e4e4e7;
      --text:        #18181b;
      --text-muted:  #71717a;
      --text-subtle: #a1a1aa;
      --radius:      6px;
      --radius-sm:   4px;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.08);
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    /* ── Slide list ───────────────────────────────────────────────────────── */
    .slide-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }
    .slide-list::-webkit-scrollbar { width: 4px; }
    .slide-list::-webkit-scrollbar-track { background: transparent; }
    .slide-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .slide-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
      position: relative;
    }
    .slide-item:hover { background: var(--surface); }
    .slide-item:last-child { border-bottom: none; }

    .slide-number {
      font-size: 11px;
      color: var(--text-subtle);
      font-weight: 500;
      min-width: 20px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Status Badge ─────────────────────────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity .12s, box-shadow .12s;
      flex: 1;
      min-width: 0;
    }
    .status-badge:hover {
      opacity: .85;
      box-shadow: var(--shadow-sm);
    }
    .status-badge-emoji { font-size: 13px; flex-shrink: 0; }
    .status-badge-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Status Selector (dropdown) ───────────────────────────────────────── */
    .selector-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
    }
    .selector-overlay.open { display: block; }

    .selector-menu {
      position: absolute;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      min-width: 200px;
      max-width: 260px;
      z-index: 20;
      overflow: hidden;
    }
    .selector-header {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .selector-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: background .1s;
      font-size: 13px;
    }
    .selector-option:hover { background: var(--surface); }
    .selector-option.active { background: var(--surface); font-weight: 500; }
    .selector-option-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Loading ──────────────────────────────────────────────────────────── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 1;
      color: var(--text-muted);
      font-size: 13px;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--text-muted);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty / Error ────────────────────────────────────────────────────── */
    .empty, .error-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 13px;
      padding: 24px;
      text-align: center;
    }
    .error-state { color: #dc2626; }

    /* ── Toast ────────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 48px;
      left: 12px;
      right: 12px;
      background: #18181b;
      color: #fafafa;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity .2s;
      z-index: 30;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #dc2626; }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .footer {
      padding: 7px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-subtle);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="header-title">SlideStatus</span>
  </div>

  <!-- Conteúdo principal -->
  <div id="main" class="loading">
    <div class="spinner"></div>
    <span>Carregando slides...</span>
  </div>

  <!-- Dropdown de seleção de status -->
  <div class="selector-overlay" id="selectorOverlay" onclick="closeSelector()">
    <div class="selector-menu" id="selectorMenu">
      <div class="selector-header">Alterar status</div>
      <div id="selectorOptions"></div>
    </div>
  </div>

  <!-- Toast de feedback -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <div class="footer">
    <span id="syncLabel">SlideStatus M2</span>
  </div>

  <script>
    // ── Estado da aplicação ──────────────────────────────────────────────────
    let state = {
      slides: [],
      statuses: [],
      slideStatuses: {},
      activeSelectorSlideId: null,
      pendingSlideId: null,
      pendingOldStatusId: null
    };

    // ── Inicialização ────────────────────────────────────────────────────────
    google.script.run
      .withSuccessHandler(onInitialStateLoaded)
      .withFailureHandler(onLoadError)
      .getInitialState();

    function onInitialStateLoaded(data) {
      state.slides = data.slides;
      state.statuses = data.statuses;
      state.slideStatuses = data.slideStatuses || {};
      renderSlideList();
    }

    function onLoadError(err) {
      document.getElementById('main').innerHTML =
        '<div class="error-state">Erro ao carregar: ' + (err.message || err) + '</div>';
    }

    // ── Renderização ─────────────────────────────────────────────────────────
    function renderSlideList() {
      const main = document.getElementById('main');

      if (!state.slides || state.slides.length === 0) {
        main.className = 'empty';
        main.innerHTML = '<span>Nenhum slide encontrado.</span>';
        return;
      }

      main.className = 'slide-list';
      main.innerHTML = '';

      state.slides.forEach(function(slide) {
        const item = document.createElement('div');
        item.className = 'slide-item';
        item.id = 'slide-' + slide.id;

        const number = document.createElement('span');
        number.className = 'slide-number';
        number.textContent = slide.pageNumber;

        const badge = createStatusBadge(slide.id);

        item.appendChild(number);
        item.appendChild(badge);
        main.appendChild(item);
      });
    }

    function createStatusBadge(slideId) {
      const statusInfo = resolveSlideStatus(slideId);
      const badge = document.createElement('div');
      badge.className = 'status-badge';
      badge.id = 'badge-' + slideId;
      badge.style.backgroundColor = hexToRgba(statusInfo.color, 0.12);
      badge.style.color = statusInfo.color;
      badge.innerHTML =
        '<span class="status-badge-emoji">' + statusInfo.emoji + '</span>' +
        '<span class="status-badge-name">' + escHtml(statusInfo.name) + '</span>';
      badge.onclick = function(e) {
        e.stopPropagation();
        openSelector(slideId, badge);
      };
      return badge;
    }

    function resolveSlideStatus(slideId) {
      const entry = state.slideStatuses[slideId];
      const statusId = entry ? entry.statusId : 'default-001';
      const status = state.statuses.find(function(s) { return s.id === statusId; });
      return status || { id: 'default-001', name: 'A Fazer', emoji: '🔲', color: '#6B7280' };
    }

    function updateBadge(slideId, statusId) {
      const status = state.statuses.find(function(s) { return s.id === statusId; });
      if (!status) return;
      const badge = document.getElementById('badge-' + slideId);
      if (!badge) return;
      badge.style.backgroundColor = hexToRgba(status.color, 0.12);
      badge.style.color = status.color;
      badge.innerHTML =
        '<span class="status-badge-emoji">' + status.emoji + '</span>' +
        '<span class="status-badge-name">' + escHtml(status.name) + '</span>';
    }

    // ── Status Selector ──────────────────────────────────────────────────────
    function openSelector(slideId, badgeEl) {
      const currentStatusId = (state.slideStatuses[slideId] || {}).statusId || 'default-001';
      state.activeSelectorSlideId = slideId;

      const optionsEl = document.getElementById('selectorOptions');
      optionsEl.innerHTML = '';

      state.statuses.forEach(function(status) {
        const opt = document.createElement('div');
        opt.className = 'selector-option' + (status.id === currentStatusId ? ' active' : '');
        opt.innerHTML =
          '<span class="selector-option-dot" style="background:' + status.color + '"></span>' +
          '<span>' + status.emoji + ' ' + escHtml(status.name) + '</span>';
        opt.onclick = function(e) {
          e.stopPropagation();
          selectStatus(slideId, status.id, currentStatusId);
        };
        optionsEl.appendChild(opt);
      });

      // Posicionar o menu próximo ao badge clicado
      const rect = badgeEl.getBoundingClientRect();
      const menu = document.getElementById('selectorMenu');
      menu.style.top = (rect.bottom + 4) + 'px';
      menu.style.left = rect.left + 'px';

      document.getElementById('selectorOverlay').classList.add('open');
    }

    function closeSelector() {
      document.getElementById('selectorOverlay').classList.remove('open');
      state.activeSelectorSlideId = null;
    }

    function selectStatus(slideId, newStatusId, oldStatusId) {
      closeSelector();
      if (newStatusId === oldStatusId) return;

      // Atualização otimista: reflete na UI antes da confirmação do servidor
      if (!state.slideStatuses[slideId]) state.slideStatuses[slideId] = {};
      state.pendingSlideId = slideId;
      state.pendingOldStatusId = oldStatusId;
      state.slideStatuses[slideId].statusId = newStatusId;
      updateBadge(slideId, newStatusId);

      google.script.run
        .withSuccessHandler(onStatusUpdated)
        .withFailureHandler(onStatusUpdateFailed)
        .updateSlideStatus(slideId, newStatusId);
    }

    function onStatusUpdated(result) {
      state.pendingSlideId = null;
      state.pendingOldStatusId = null;
      showToast('Status atualizado', false);
    }

    function onStatusUpdateFailed(err) {
      // Reverter para o status anterior
      if (state.pendingSlideId) {
        state.slideStatuses[state.pendingSlideId].statusId = state.pendingOldStatusId;
        updateBadge(state.pendingSlideId, state.pendingOldStatusId);
        state.pendingSlideId = null;
        state.pendingOldStatusId = null;
      }
      showToast('Erro: ' + (err.message || 'Falha ao salvar.'), true);
    }

    // ── Toast ────────────────────────────────────────────────────────────────
    function showToast(msg, isError) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(function() { toast.className = 'toast'; }, 2500);
    }

    // ── Utilitários ──────────────────────────────────────────────────────────
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
