<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <!-- Geist via Google Fonts — mesmo token do DS do time -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens DS — Light Mode ───────────────────────────────────────────── */
    :root {
      --font-sans:   'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
      --bg:          #ffffff;
      --surface:     #f4f4f5;
      --card:        #fafafa;
      --border:      #e4e4e7;
      --text:        #18181b;
      --text-muted:  #71717a;
      --text-subtle: #a1a1aa;
      --radius:      6px;
      --radius-sm:   4px;
      --radius-full: 9999px;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);

      /* Categorias de progresso */
      --color-done:        #10B981;
      --color-done-bg:     rgba(16,185,129,.1);
      --color-progress:    #3B82F6;
      --color-progress-bg: rgba(59,130,246,.1);
      --color-pending:     #a1a1aa;
      --color-pending-bg:  rgba(161,161,170,.12);

      --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
      --sp-4: 16px; --sp-5: 20px; --sp-6: 24px;
    }

    /* ── Reset & Base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 var(--sp-4);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      height: 42px;
    }
    .header-spacer { width: 1fr; }
    .header-actions { justify-self: end; display: flex; gap: 2px; }
    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--sp-1);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, color .12s;
      flex-shrink: 0;
    }
    .btn-icon:hover { background: var(--border); color: var(--text); }
    .btn-icon.spinning svg { animation: spin .7s linear infinite; }

    /* ── Progress Bar ─────────────────────────────────────────────────────── */
    .progress-section {
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }
    .progress-track {
      height: 5px;
      border-radius: var(--radius-full);
      background: var(--border);
      overflow: hidden;
      display: flex;
    }
    .progress-seg {
      height: 100%;
      transition: width .35s ease;
      min-width: 0;
    }
    .progress-seg.done     { background: var(--color-done); }
    .progress-seg.progress { background: var(--color-progress); }
    .progress-seg.pending  { background: var(--color-pending); }

    .progress-labels {
      display: flex;
      gap: var(--sp-3);
      flex-wrap: wrap;
    }
    .progress-label {
      display: flex;
      align-items: center;
      gap: var(--sp-1);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .progress-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .progress-label strong {
      font-weight: 600;
      color: var(--text);
    }

    /* ── Slide list ───────────────────────────────────────────────────────── */
    .slide-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--sp-1) 0;
    }
    .slide-list::-webkit-scrollbar { width: 3px; }
    .slide-list::-webkit-scrollbar-track { background: transparent; }
    .slide-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .slide-item {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 6px var(--sp-4);
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .slide-item:hover { background: var(--surface); }
    .slide-item:last-child { border-bottom: none; }

    .slide-number {
      font-size: 11px;
      color: var(--text-subtle);
      font-weight: 500;
      min-width: 18px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── Status Badge ─────────────────────────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .12s, box-shadow .12s;
      flex: 1;
      min-width: 0;
      line-height: 1.4;
    }
    .status-badge:hover { opacity: .82; box-shadow: var(--shadow-sm); }
    .status-badge-emoji { font-size: 12px; flex-shrink: 0; }
    .status-badge-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Status Selector ──────────────────────────────────────────────────── */
    .selector-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
    }
    .selector-overlay.open { display: block; }
    .selector-menu {
      position: fixed;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
      min-width: 200px;
      max-width: 264px;
      z-index: 20;
      overflow: hidden;
    }
    .selector-header {
      padding: 7px var(--sp-3);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .selector-option {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 7px var(--sp-3);
      cursor: pointer;
      transition: background .1s;
      font-size: 12px;
    }
    .selector-option:hover { background: var(--surface); }
    .selector-option.active { background: var(--surface); font-weight: 600; }
    .selector-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Loading / Empty / Error ──────────────────────────────────────────── */
    .loading, .empty-state, .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      flex: 1;
      color: var(--text-muted);
      font-size: 13px;
      padding: var(--sp-6);
      text-align: center;
    }
    .error-state { color: #dc2626; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--text-muted);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ────────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 44px;
      left: var(--sp-3);
      right: var(--sp-3);
      background: var(--text);
      color: #fafafa;
      font-size: 12px;
      font-weight: 500;
      padding: 7px var(--sp-3);
      border-radius: var(--radius);
      opacity: 0;
      transition: opacity .2s;
      z-index: 30;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: #dc2626; }

    /* ── History button ───────────────────────────────────────────────────── */
    .btn-history {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: var(--radius-sm);
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: color .12s, background .12s;
    }
    .btn-history:hover { color: var(--text-muted); background: var(--border); }

    /* ── History panel ────────────────────────────────────────────────────── */
    .history-panel {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .history-panel::-webkit-scrollbar { width: 3px; }
    .history-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .history-slide-info {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .history-slide-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-right: auto;
    }

    .history-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-subtle);
      font-size: 12px;
      padding: var(--sp-6);
    }

    .history-item {
      display: flex;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--border);
    }
    .history-item:last-child { border-bottom: none; }

    .history-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-top: 1px;
      text-transform: uppercase;
    }

    .history-body { flex: 1; min-width: 0; }
    .history-user {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-change {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      line-height: 1.5;
    }
    .history-status {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
    }
    .history-arrow { color: var(--text-subtle); font-size: 10px; }
    .history-time {
      font-size: 11px;
      color: var(--text-subtle);
      margin-top: 3px;
    }

    .history-loading {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      color: var(--text-muted);
      font-size: 12px;
    }

    /* ── Back button na header ────────────────────────────────────────────── */
    .btn-back {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: var(--sp-1);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-sans);
      padding: 3px 6px;
      border-radius: var(--radius-sm);
      transition: background .12s, color .12s;
    }
    .btn-back:hover { background: var(--border); color: var(--text); }

    /* ── Settings panel ──────────────────────────────────────────────────── */
    .settings-panel {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .settings-panel::-webkit-scrollbar { width: 3px; }
    .settings-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .settings-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-2) var(--sp-4);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .settings-section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .btn-add {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-sans);
      padding: 4px 8px;
      cursor: pointer;
      transition: opacity .12s;
    }
    .btn-add:hover { opacity: .85; }

    .status-row {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 8px var(--sp-4);
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .status-row:last-child { border-bottom: none; }
    .status-row:hover { background: var(--surface); }
    .status-row.inactive { opacity: .5; }

    .status-row-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-row-name {
      flex: 1;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-row-emoji { font-size: 13px; flex-shrink: 0; }
    .chip-default {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-subtle);
      background: var(--border);
      border-radius: var(--radius-sm);
      padding: 1px 4px;
      letter-spacing: .04em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    /* Toggle switch */
    .toggle {
      width: 28px; height: 16px;
      border-radius: var(--radius-full);
      background: var(--border);
      position: relative;
      cursor: pointer;
      border: none;
      flex-shrink: 0;
      transition: background .2s;
    }
    .toggle.on { background: var(--color-done); }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .toggle.on::after { transform: translateX(12px); }

    .btn-edit {
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px;
      border-radius: var(--radius-sm);
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      transition: color .12s, background .12s;
      flex-shrink: 0;
    }
    .btn-edit:hover { color: var(--text-muted); background: var(--border); }

    /* Form */
    .status-form {
      padding: var(--sp-3) var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
      flex: 1;
    }
    .form-preview {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-3);
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      margin-bottom: var(--sp-1);
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .form-input {
      width: 100%;
      padding: 6px var(--sp-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-family: var(--font-sans);
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color .15s;
    }
    .form-input:focus { border-color: var(--text-muted); }
    .form-input.error { border-color: #dc2626; }
    .form-error { font-size: 11px; color: #dc2626; min-height: 14px; }
    .form-row { display: flex; gap: var(--sp-2); }
    .form-row .form-group { flex: 1; }
    .form-char-count {
      font-size: 10px;
      color: var(--text-subtle);
      text-align: right;
      margin-top: 2px;
    }
    input[type="color"].form-input {
      padding: 2px 4px;
      height: 32px;
      cursor: pointer;
    }
    .form-actions {
      display: flex;
      gap: var(--sp-2);
      margin-top: var(--sp-1);
    }
    .btn-primary {
      flex: 1;
      padding: 7px;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: opacity .12s;
    }
    .btn-primary:hover { opacity: .85; }
    .btn-secondary {
      flex: 1;
      padding: 7px;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background .12s;
    }
    .btn-secondary:hover { background: var(--border); }

    /* ── Estado recolhido ────────────────────────────────────────────────── */
    body.ss-collapsed .progress-section,
    body.ss-collapsed #main,
    body.ss-collapsed #historyPanel,
    body.ss-collapsed #settingsPanel,
    body.ss-collapsed .offline-banner,
    body.ss-collapsed .footer,
    body.ss-collapsed #selectorOverlay,
    body.ss-collapsed .toast { display: none !important; }
    body.ss-collapsed .header { border-bottom: none; }
    #btnCollapse svg { transition: transform .2s; }

    /* ── Offline banner ──────────────────────────────────────────────────── */
    .offline-banner {
      display: none;
      align-items: center;
      gap: var(--sp-2);
      padding: 7px var(--sp-4);
      background: #fef3c7;
      border-bottom: 1px solid #fde68a;
      font-size: 11px;
      color: #92400e;
      flex-shrink: 0;
    }
    .offline-banner.show { display: flex; }
    .offline-banner svg { flex-shrink: 0; }
    .offline-banner span { flex: 1; }

    /* ── Sync indicator ───────────────────────────────────────────────────── */
    .sync-dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--color-done);
      margin-right: 4px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .sync-dot.syncing {
      background: var(--color-progress);
      animation: pulse .9s ease-in-out infinite alternate;
    }
    .sync-dot.offline { background: #f59e0b; }
    @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }

    /* ── Footer ───────────────────────────────────────────────────────────── */
    .footer {
      padding: 6px var(--sp-4);
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-subtle);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 32px;
    }
  </style>
</head>
<body>

  <!-- Header — muda conforme a view ativa -->

  <script>
    // ── Estado ───────────────────────────────────────────────────────────────
    const POLL_INTERVAL_MS       = 10000;
    const MAX_FAILURES_FOR_BANNER = 3;

    let state = {
      slides: [],
      statuses: [],
      slideStatuses: {},
      isRefreshing: false,
      pendingSlideId: null,
      pendingOldStatusId: null,
      lastKnownTimestamp: null,
      lastSuccessfulPoll: null,
      consecutiveFailures: 0
    };

    // ── Inicialização ────────────────────────────────────────────────────────
    setSyncState('syncing');
    google.script.run
      .withSuccessHandler(onInitialStateLoaded)
      .withFailureHandler(onLoadError)
      .getInitialState();

    function onInitialStateLoaded(data) {
      state.slides        = data.slides;
      state.statuses      = data.statuses;
      state.slideStatuses = data.slideStatuses || {};
      renderSlideList();
      renderProgressBar();
      updateFooter();
      setSyncState('ok');
      startPolling();
      startSyncCounter();
    }

    function onLoadError(err) {
      document.getElementById('main').innerHTML =
        '<div class="error-state">Erro ao carregar:<br>' + escHtml(err.message || String(err)) + '</div>';
      setSyncState('offline');
    }

    // ── Polling automático (M5) ───────────────────────────────────────────────
    function startPolling() {
      setInterval(doPoll, POLL_INTERVAL_MS);
    }

    function doPoll() {
      if (state.isRefreshing) return;
      state.isRefreshing = true;
      setSyncState('syncing');
      setRefreshSpinner(true);
      google.script.run
        .withSuccessHandler(onPollSuccess)
        .withFailureHandler(onPollFailure)
        .getFullState();
    }

    function onPollSuccess(fullState) {
      state.isRefreshing        = false;
      state.consecutiveFailures = 0;
      state.lastSuccessfulPoll  = Date.now();
      setRefreshSpinner(false);
      setSyncState('ok');
      hideOfflineBanner();

      // Só reconcilia se houve mudanças desde o último poll
      if (fullState.lastUpdated !== state.lastKnownTimestamp) {
        state.lastKnownTimestamp = fullState.lastUpdated;
        reconcileSlides(fullState.slides, fullState.statuses, fullState.slideStatuses || {});
      }
    }

    function onPollFailure() {
      state.isRefreshing = false;
      state.consecutiveFailures++;
      setRefreshSpinner(false);
      setSyncState('offline');
      if (state.consecutiveFailures >= MAX_FAILURES_FOR_BANNER) showOfflineBanner();
    }

    // ── Refresh manual (botão ↺) ──────────────────────────────────────────────
    function manualRefresh() {
      if (state.isRefreshing) return;
      doPoll();
    }

    // ── Reconciliação de estado ───────────────────────────────────────────────
    function reconcileSlides(newSlides, newStatuses, newSlideStatuses) {
      const oldIds = new Set(state.slides.map(function(s) { return s.id; }));
      const newIds = new Set(newSlides.map(function(s) { return s.id; }));
      const hasStructuralChange =
        newSlides.some(function(s) { return !oldIds.has(s.id); }) ||
        state.slides.some(function(s) { return !newIds.has(s.id); });

      state.statuses = newStatuses;

      if (hasStructuralChange) {
        state.slides        = newSlides;
        state.slideStatuses = Object.assign({}, newSlideStatuses, state.slideStatuses);
        renderSlideList();
      } else {
        // Atualiza apenas os badges que mudaram
        Object.keys(newSlideStatuses).forEach(function(sid) {
          const oldEntry = state.slideStatuses[sid];
          const newEntry = newSlideStatuses[sid];
          if (!oldEntry || oldEntry.statusId !== newEntry.statusId) {
            // Não sobrescreve se há uma atualização otimista pendente
            if (state.pendingSlideId !== sid) {
              state.slideStatuses[sid] = newEntry;
              updateBadge(sid, newEntry.statusId);
            }
          }
        });
      }

      renderProgressBar();
      updateFooter();
    }

    // ── Indicadores visuais de sync ───────────────────────────────────────────
    function setSyncState(s) {
      const dot   = document.getElementById('syncDot');
      const label = document.getElementById('syncLabel');
      if (!dot || !label) return;
      dot.className = 'sync-dot ' + (s === 'syncing' ? 'syncing' : s === 'offline' ? 'offline' : '');
      if (s === 'syncing') label.textContent = 'Sincronizando...';
      else if (s === 'offline') label.textContent = 'Offline';
    }

    function startSyncCounter() {
      state.lastSuccessfulPoll = Date.now();
      setInterval(function() {
        if (!state.lastSuccessfulPoll) return;
        const label = document.getElementById('syncLabel');
        if (!label) return;
        // Não atualizar se estiver em outro estado
        const dot = document.getElementById('syncDot');
        if (dot && (dot.classList.contains('syncing') || dot.classList.contains('offline'))) return;
        const sec = Math.floor((Date.now() - state.lastSuccessfulPoll) / 1000);
        label.textContent = sec < 5 ? 'Atualizado agora' : 'Atualizado há ' + sec + 's';
      }, 1000);
    }

    function showOfflineBanner() {
      document.getElementById('offlineBanner').classList.add('show');
    }
    function hideOfflineBanner() {
      document.getElementById('offlineBanner').classList.remove('show');
    }

    function setRefreshSpinner(on) {
      const btn = document.getElementById('btnRefresh');
      if (btn) btn.classList.toggle('spinning', on);
    }

    // ── Renderização da lista de slides ───────────────────────────────────────
    function renderSlideList() {
      const main = document.getElementById('main');

      if (!state.slides || state.slides.length === 0) {
        main.className = 'empty-state';
        main.innerHTML = '<span>Nenhum slide encontrado.</span>';
        return;
      }

      main.className = 'slide-list';
      main.innerHTML = '';

      state.slides.forEach(function(slide) {
        const item = document.createElement('div');
        item.className = 'slide-item';
        item.id = 'slide-' + slide.id;

        const num = document.createElement('span');
        num.className = 'slide-number';
        num.textContent = slide.pageNumber;

        item.appendChild(num);
        item.appendChild(createBadgeEl(slide.id));
        item.appendChild(createHistoryBtn(slide.id));
        main.appendChild(item);
      });
    }

    function createHistoryBtn(slideId) {
      const btn = document.createElement('button');
      btn.className = 'btn-history';
      btn.title = 'Ver histórico';
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
      btn.onclick = function(e) { e.stopPropagation(); openHistoryPanel(slideId); };
      return btn;
    }

    function createBadgeEl(slideId) {
      const s = resolveSlideStatus(slideId);
      const el = document.createElement('div');
      el.className = 'status-badge';
      el.id = 'badge-' + slideId;
      el.style.backgroundColor = hexToRgba(s.color, 0.11);
      el.style.color = s.color;
      el.innerHTML = _badgeHtml(s);
      el.onclick = function(e) { e.stopPropagation(); openSelector(slideId, el); };
      return el;
    }

    function updateBadge(slideId, statusId) {
      const s = state.statuses.find(function(x) { return x.id === statusId; });
      if (!s) return;
      const el = document.getElementById('badge-' + slideId);
      if (!el) return;
      el.style.backgroundColor = hexToRgba(s.color, 0.11);
      el.style.color = s.color;
      el.innerHTML = _badgeHtml(s);
    }

    // ── Barra de Progresso ────────────────────────────────────────────────────
    function computeStats() {
      const total = state.slides.length;
      if (total === 0) return null;
      const counts = { done: 0, in_progress: 0, pending: 0 };
      state.slides.forEach(function(slide) {
        const s = resolveSlideStatus(slide.id);
        const full = state.statuses.find(function(x) { return x.id === s.id; });
        const cat = full ? (full.category || 'pending') : 'pending';
        counts[cat] = (counts[cat] || 0) + 1;
      });
      const pDone = Math.round(counts.done / total * 100);
      const pIP   = Math.round(counts.in_progress / total * 100);
      const pPend = 100 - pDone - pIP;
      return {
        done:        { count: counts.done,        percent: pDone  },
        in_progress: { count: counts.in_progress, percent: pIP    },
        pending:     { count: counts.pending,     percent: pPend  },
        total: total
      };
    }

    function renderProgressBar() {
      const stats = computeStats();
      const section = document.getElementById('progressSection');
      if (!stats || stats.total === 0) { section.style.display = 'none'; return; }

      section.style.display = 'flex';
      document.getElementById('segDone').style.width     = stats.done.percent        + '%';
      document.getElementById('segProgress').style.width = stats.in_progress.percent + '%';
      document.getElementById('segPending').style.width  = stats.pending.percent     + '%';

      const labels = [];
      if (stats.done.count > 0)        labels.push(makeLabelHtml('var(--color-done)',     stats.done.percent,        stats.done.count,        'concluído'));
      if (stats.in_progress.count > 0) labels.push(makeLabelHtml('var(--color-progress)', stats.in_progress.percent, stats.in_progress.count, 'andamento'));
      if (stats.pending.count > 0)     labels.push(makeLabelHtml('var(--color-pending)',  stats.pending.percent,     stats.pending.count,     'pendente'));
      document.getElementById('progressLabels').innerHTML = labels.join('');
    }

    function makeLabelHtml(color, percent, count, label) {
      return '<span class="progress-label">' +
        '<span class="progress-dot" style="background:' + color + '"></span>' +
        '<strong>' + percent + '%</strong> ' + count + ' ' + label +
        (count !== 1 ? 's' : '') +
        '</span>';
    }

    // ── Histórico ─────────────────────────────────────────────────────────────
    function openHistoryPanel(slideId) {
      setView('detail', slideId);
      const panel = document.getElementById('historyPanel');
      panel.innerHTML = '<div class="history-loading"><div class="spinner"></div><span>Carregando...</span></div>';

      google.script.run
        .withSuccessHandler(function(detail) { renderHistory(detail); })
        .withFailureHandler(function(err) {
          panel.innerHTML = '<div class="history-empty">Erro ao carregar histórico.</div>';
        })
        .getSlideDetail(slideId);
    }

    function renderHistory(detail) {
      const panel = document.getElementById('historyPanel');
      panel.innerHTML = '';

      // Info do slide no topo
      const info = document.createElement('div');
      info.className = 'history-slide-info';
      const s = resolveSlideStatus(detail.slideId);
      info.innerHTML =
        '<span class="history-slide-label">Slide ' + detail.pageNumber + '</span>' +
        '<div class="status-badge" style="background:' + hexToRgba(s.color, 0.11) + ';color:' + s.color + ';flex:none">' +
        s.emoji + ' ' + escHtml(s.name) + '</div>';
      panel.appendChild(info);

      if (!detail.history || detail.history.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'history-empty';
        empty.textContent = 'Nenhuma alteração registrada.';
        panel.appendChild(empty);
        return;
      }

      detail.history.forEach(function(entry) {
        const item = document.createElement('div');
        item.className = 'history-item';

        const initial = (entry.changedBy || '?')[0].toUpperCase();
        const avatarEl = document.createElement('div');
        avatarEl.className = 'history-avatar';
        avatarEl.textContent = initial;

        const body = document.createElement('div');
        body.className = 'history-body';

        const user = document.createElement('div');
        user.className = 'history-user';
        user.textContent = entry.changedBy || 'desconhecido';

        const change = document.createElement('div');
        change.className = 'history-change';
        if (entry.fromStatus) {
          change.innerHTML =
            statusChip(entry.fromStatus) +
            '<span class="history-arrow">&rarr;</span>' +
            statusChip(entry.toStatus);
        } else {
          change.innerHTML = 'Inicial: ' + statusChip(entry.toStatus);
        }

        const time = document.createElement('div');
        time.className = 'history-time';
        time.textContent = relativeTime(entry.changedAt);

        body.appendChild(user);
        body.appendChild(change);
        body.appendChild(time);
        item.appendChild(avatarEl);
        item.appendChild(body);
        panel.appendChild(item);
      });
    }

    function statusChip(s) {
      return '<span class="history-status" style="background:' + hexToRgba(s.color, 0.11) + ';color:' + s.color + '">' +
        (s.emoji ? s.emoji + ' ' : '') + escHtml(s.name) + '</span>';
    }

    // ── Navegação entre views ─────────────────────────────────────────────────
    const _BACK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';

    // ── Status Selector ───────────────────────────────────────────────────────
    function openSelector(slideId, badgeEl) {
      const currentId = (state.slideStatuses[slideId] || {}).statusId || 'default-001';
      const opts = document.getElementById('selectorOptions');
      opts.innerHTML = '';
      state.statuses.forEach(function(s) {
        const opt = document.createElement('div');
        opt.className = 'selector-option' + (s.id === currentId ? ' active' : '');
        opt.innerHTML =
          '<span class="selector-dot" style="background:' + s.color + '"></span>' +
          escHtml((s.emoji ? s.emoji + ' ' : '') + s.name);
        opt.onclick = function(e) { e.stopPropagation(); selectStatus(slideId, s.id, currentId); };
        opts.appendChild(opt);
      });

      const rect = badgeEl.getBoundingClientRect();
      const menu = document.getElementById('selectorMenu');
      menu.style.top  = (rect.bottom + 4) + 'px';
      menu.style.left = rect.left + 'px';
      document.getElementById('selectorOverlay').classList.add('open');
    }

    function closeSelector() {
      document.getElementById('selectorOverlay').classList.remove('open');
    }

    function selectStatus(slideId, newId, oldId) {
      closeSelector();
      if (newId === oldId) return;

      // Atualização otimista
      if (!state.slideStatuses[slideId]) state.slideStatuses[slideId] = {};
      state.pendingSlideId    = slideId;
      state.pendingOldStatusId = oldId;
      state.slideStatuses[slideId].statusId = newId;
      updateBadge(slideId, newId);
      renderProgressBar();

      google.script.run
        .withSuccessHandler(onStatusUpdated)
        .withFailureHandler(onStatusUpdateFailed)
        .updateSlideStatus(slideId, newId);
    }

    function onStatusUpdated() {
      state.pendingSlideId = null;
      state.pendingOldStatusId = null;
    }

    function onStatusUpdateFailed(err) {
      if (state.pendingSlideId) {
        state.slideStatuses[state.pendingSlideId].statusId = state.pendingOldStatusId;
        updateBadge(state.pendingSlideId, state.pendingOldStatusId);
        renderProgressBar();
        state.pendingSlideId = null;
        state.pendingOldStatusId = null;
      }
      showToast('Erro: ' + escHtml(err.message || 'Falha ao salvar.'), true);
    }

    // ── Footer ────────────────────────────────────────────────────────────────
    function updateFooter() {
      const n = state.slides.length;
      document.getElementById('slideCount').textContent = n + ' slide' + (n !== 1 ? 's' : '');
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(function() { t.className = 'toast'; }, 2500);
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function resolveSlideStatus(slideId) {
      const entry = state.slideStatuses[slideId];
      const id = entry ? entry.statusId : 'default-001';
      return state.statuses.find(function(s) { return s.id === id; }) ||
        { id: 'default-001', name: 'A Fazer', emoji: '🔲', color: '#6B7280', category: 'pending' };
    }

    function relativeTime(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const s = Math.floor(diff / 1000);
      if (s < 60)  return 'agora';
      const m = Math.floor(s / 60);
      if (m < 60)  return 'há ' + m + ' min';
      const h = Math.floor(m / 60);
      if (h < 24)  return 'há ' + h + 'h';
      const d = Math.floor(h / 24);
      if (d < 30)  return 'há ' + d + 'd';
      return new Date(iso).toLocaleDateString('pt-BR');
    }

    function hexToRgba(hex, a) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return 'rgba('+r+','+g+','+b+','+a+')';
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function _badgeHtml(s) {
      return (s.emoji ? '<span class="status-badge-emoji">' + s.emoji + '</span>' : '') +
        '<span class="status-badge-name">' + escHtml(s.name) + '</span>';
    }

    // ── Recolher sidebar ──────────────────────────────────────────────────────
    // Ícones Lucide inline: panel-right-close (expandido) / panel-right-open (recolhido)
    const _ICON_COLLAPSE = '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/>';
    const _ICON_EXPAND   = '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M15 3v18"/><path d="m11 9-3 3 3 3"/>';

    let isCollapsed = false;
    function toggleCollapse() {
      isCollapsed = !isCollapsed;
      document.body.classList.toggle('ss-collapsed', isCollapsed);
      const icon = document.getElementById('collapseIcon');
      if (icon) icon.innerHTML = isCollapsed ? _ICON_EXPAND : _ICON_COLLAPSE;
      const btn = document.getElementById('btnCollapse');
      if (btn) btn.title = isCollapsed ? 'Expandir' : 'Recolher';
    }

    // ── Settings ──────────────────────────────────────────────────────────────
    let settingsEditingId = null;
    let allStatuses = [];

    function refreshAllStatuses(cb) {
      google.script.run
        .withSuccessHandler(function(s) { allStatuses = s; if (cb) cb(); })
        .withFailureHandler(function(e) { showToast('Erro ao carregar: ' + escHtml(e.message), true); })
        .getStatuses();
    }

    function renderSettingsList() {
      settingsEditingId = null;
      const panel = document.getElementById('settingsPanel');
      panel.innerHTML = '<div class="history-loading"><div class="spinner"></div><span>Carregando...</span></div>';
      refreshAllStatuses(function() { _drawSettingsList(); });
    }

    function _drawSettingsList() {
      const panel = document.getElementById('settingsPanel');
      panel.innerHTML = '';
      const toolbar = document.createElement('div');
      toolbar.className = 'settings-toolbar';
      toolbar.innerHTML =
        '<span class="settings-section-label">Status</span>' +
        '<button class="btn-add" onclick="openStatusForm(null)">+ Novo</button>';
      panel.appendChild(toolbar);
      const list = document.createElement('div');
      allStatuses.forEach(function(s) { list.appendChild(_buildStatusRow(s)); });
      panel.appendChild(list);
    }

    function _buildStatusRow(s) {
      const row = document.createElement('div');
      row.className = 'status-row' + (s.active ? '' : ' inactive');
      row.id = 'settrow-' + s.id;
      const editSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
      row.innerHTML =
        '<span class="status-row-dot" style="background:' + s.color + '"></span>' +
        (s.emoji ? '<span class="status-row-emoji">' + s.emoji + '</span>' : '') +
        '<span class="status-row-name">' + escHtml(s.name) + '</span>' +
        (s.isDefault ? '<span class="chip-default">Padrão</span>' : '') +
        '<button class="btn-edit" onclick="openStatusForm(\'' + s.id + '\')" title="Editar">' + editSvg + '</button>' +
        '<button class="toggle' + (s.active ? ' on' : '') + '" onclick="handleToggleStatus(\'' + s.id + '\')" title="' + (s.active ? 'Desativar' : 'Ativar') + '"></button>';
      return row;
    }

    function openStatusForm(statusId) {
      settingsEditingId = statusId;
      const e = statusId ? allStatuses.find(function(s) { return s.id === statusId; }) : null;
      const panel = document.getElementById('settingsPanel');
      panel.innerHTML = '';

      const toolbar = document.createElement('div');
      toolbar.className = 'settings-toolbar';
      toolbar.innerHTML =
        '<span class="settings-section-label">' + (e ? 'Editar status' : 'Novo status') + '</span>' +
        '<button class="btn-icon" onclick="_drawSettingsList()" title="Voltar">' + _BACK_SVG + '</button>';
      panel.appendChild(toolbar);

      const CATS = [
        { v: 'pending',     l: 'Pendente' },
        { v: 'in_progress', l: 'Em andamento' },
        { v: 'done',        l: 'Concluído' }
      ];
      const catOpts = CATS.map(function(c) {
        return '<option value="' + c.v + '"' + (e && e.category === c.v ? ' selected' : '') + '>' + c.l + '</option>';
      }).join('');

      const defColor = e ? e.color : '#6B7280';
      const form = document.createElement('div');
      form.className = 'status-form';
      form.innerHTML =
        '<div class="form-preview" id="formPreview" style="background:' + hexToRgba(defColor, 0.11) + ';color:' + defColor + '">' +
          '<span id="formPreviewEmoji">' + (e && e.emoji ? e.emoji : '') + '</span>' +
          '<span id="formPreviewName">' + escHtml(e ? e.name : 'Novo status') + '</span>' +
        '</div>' +
        '<div class="form-group">' +
          '<label class="form-label">Nome</label>' +
          '<input class="form-input" id="fName" maxlength="30" value="' + escHtml(e ? e.name : '') + '" oninput="updateFormPreview()" placeholder="Ex: Em revisão">' +
          '<div class="form-char-count" id="fNameCount">' + (e ? e.name.length : 0) + '/30</div>' +
          '<div class="form-error" id="fNameError"></div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group">' +
            '<label class="form-label">Emoji</label>' +
            '<input class="form-input" id="fEmoji" maxlength="4" value="' + (e ? (e.emoji || '') : '') + '" oninput="updateFormPreview()" placeholder="Opcional">' +
            '<div class="form-error" id="fEmojiError"></div>' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Cor</label>' +
            '<input type="color" class="form-input" id="fColor" value="' + (e ? e.color : '#6B7280') + '" oninput="updateFormPreview()">' +
          '</div>' +
        '</div>' +
        '<div class="form-group">' +
          '<label class="form-label">Categoria</label>' +
          '<select class="form-input" id="fCategory">' + catOpts + '</select>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button class="btn-secondary" onclick="_drawSettingsList()">Cancelar</button>' +
          '<button class="btn-primary" id="btnSaveStatus" onclick="saveStatusForm()">Salvar</button>' +
        '</div>';
      panel.appendChild(form);
    }

    function updateFormPreview() {
      const nameVal = document.getElementById('fName').value;
      const emoji   = document.getElementById('fEmoji').value;
      const color   = document.getElementById('fColor').value || '#6B7280';
      const cnt = document.getElementById('fNameCount');
      if (cnt) cnt.textContent = nameVal.length + '/30';
      const prev = document.getElementById('formPreview');
      if (prev) { prev.style.background = hexToRgba(color, 0.11); prev.style.color = color; }
      const pe = document.getElementById('formPreviewEmoji');
      const pn = document.getElementById('formPreviewName');
      if (pe) pe.textContent = emoji;
      if (pn) pn.textContent = nameVal.substring(0, 30) || 'Novo status';
    }

    function saveStatusForm() {
      const name     = (document.getElementById('fName').value || '').trim();
      const emoji    = document.getElementById('fEmoji').value.trim();
      const color    = document.getElementById('fColor').value;
      const category = document.getElementById('fCategory').value;
      let valid = true;

      document.getElementById('fName').classList.remove('error');
      document.getElementById('fNameError').textContent = '';
      document.getElementById('fEmoji').classList.remove('error');
      document.getElementById('fEmojiError').textContent = '';

      if (!name) {
        document.getElementById('fName').classList.add('error');
        document.getElementById('fNameError').textContent = 'Nome é obrigatório.';
        valid = false;
      }
      if (emoji && [...emoji].length !== 1) {
        document.getElementById('fEmoji').classList.add('error');
        document.getElementById('fEmojiError').textContent = 'Use exatamente 1 emoji ou deixe em branco.';
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('btnSaveStatus');
      if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }

      function onSaved() {
        google.script.run
          .withSuccessHandler(function(active) {
            state.statuses = active;
            _refreshVisibleBadges();
            showToast('Status salvo.');
            renderSettingsList();
          })
          .withFailureHandler(function() { renderSettingsList(); })
          .getActiveStatuses();
      }
      function onSaveErr(err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar'; }
        const fe = document.getElementById('fNameError');
        if (fe) {
          fe.textContent = err.message || 'Erro ao salvar.';
          document.getElementById('fName').classList.add('error');
        } else {
          showToast('Erro: ' + escHtml(err.message || 'Falha ao salvar.'), true);
        }
      }

      if (settingsEditingId) {
        google.script.run
          .withSuccessHandler(onSaved)
          .withFailureHandler(onSaveErr)
          .updateStatus(settingsEditingId, { name: name, emoji: emoji, color: color, category: category });
      } else {
        const maxOrder = allStatuses.reduce(function(m, s) { return Math.max(m, s.order || 0); }, 0);
        google.script.run
          .withSuccessHandler(onSaved)
          .withFailureHandler(onSaveErr)
          .createStatus(name, emoji, color, maxOrder + 1, category);
      }
    }

    function handleToggleStatus(statusId) {
      const row    = document.getElementById('settrow-' + statusId);
      const toggle = row ? row.querySelector('.toggle') : null;
      if (toggle) toggle.disabled = true;
      google.script.run
        .withSuccessHandler(function(s) {
          const idx = allStatuses.findIndex(function(x) { return x.id === s.id; });
          if (idx >= 0) allStatuses[idx] = s;
          google.script.run
            .withSuccessHandler(function(active) { state.statuses = active; _refreshVisibleBadges(); })
            .getActiveStatuses();
          if (row) { const nr = _buildStatusRow(s); row.parentNode.replaceChild(nr, row); }
        })
        .withFailureHandler(function(err) {
          if (toggle) toggle.disabled = false;
          showToast('Erro: ' + escHtml(err.message || 'Falha.'), true);
        })
        .toggleStatus(statusId);
    }

    function _refreshVisibleBadges() {
      state.slides.forEach(function(slide) {
        const s  = resolveSlideStatus(slide.id);
        const el = document.getElementById('badge-' + slide.id);
        if (!el) return;
        el.style.backgroundColor = hexToRgba(s.color, 0.11);
        el.style.color = s.color;
        el.innerHTML = _badgeHtml(s);
      });
      renderProgressBar();
    }
  </script>
</body>
</html>
